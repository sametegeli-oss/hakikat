name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bağımlılıkları kur
        run: npm install

      - name: Android projesini oluştur
        run: npx cap add android

      - name: İzinleri ekle (internet, ağ durumu)
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = [
              'android.permission.INTERNET',
              'android.permission.ACCESS_NETWORK_STATE',
          ]
          add = ''.join('    <uses-permission android:name="%s" />\n' % x for x in perms if x not in s)
          s = s.replace('</manifest>', add + '</manifest>')
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: İkonları oluştur
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Capacitor sync
        run: npx cap sync android

      - name: Debug APK derle
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: hakikat-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
